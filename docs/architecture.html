<title id="architecture-title">Ballast architecture: the reserve breaker</title>
<desc id="architecture-desc">A drain of the ReserveVault on a local anvil chain is read by the ballast watchdog, whose watcher key freezes asset 4401 through the M_watch multisig on the Portaldot V3 testnet, so a holder's transfer is refused; mint and thaw need the reserve bot's co-signature through M_mint and M_admin, and the attester and ballast verify tie both chains together.</desc>
