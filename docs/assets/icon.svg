<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Ballast — a load-line disc whose reserves sit below the line, with a gate shut across it: the wrapped asset is frozen">
  <title>Ballast</title>
  <defs>
    <clipPath id="bl-disc"><circle cx="226" cy="256" r="156"/></clipPath>
  </defs>
  <!-- self-carried plate: holds on GitHub light (#0C2536) and dark (#0d1117) -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="#0C2536"/>
  <!-- reserves: the water, sunk below the load line (the cream band is the shortfall) -->
  <rect x="40" y="318" width="380" height="200" fill="#3FD9B5" clip-path="url(#bl-disc)"/>
  <rect x="40" y="318" width="380" height="8" fill="#B8FFEC" clip-path="url(#bl-disc)"/>
  <!-- Plimsoll ring -->
  <circle cx="226" cy="256" r="156" fill="none" stroke="#6F92A6" stroke-width="40"/>
  <!-- load line (supply) up to the gate -->
  <rect x="36" y="236" width="316" height="40" fill="#F4F1E6"/>
  <!-- dead line past the gate: nothing passes -->
  <rect x="398" y="236" width="80" height="40" fill="#3E5A6C"/>
  <!-- the gate, snapped shut across the load line -->
  <rect x="354" y="150" width="40" height="212" rx="6" fill="#FF5B2E"/>
</svg>
