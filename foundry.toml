# Foundry: ReserveVault (Sepolia side). ReserveOracle is tested with Hardhat (hardhat.config.js).
[profile.default]
src = "contracts"
test = "tests/forge"
out = "out"
cache_path = "cache/forge"
libs = ["lib"]
solc_version = "0.8.24"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200

[fuzz]
runs = 512
